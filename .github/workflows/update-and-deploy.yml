name: Update CF data and deploy Pages

on:
  # 手动触发：会抓取数据并重新部署
  workflow_dispatch:
  # 推送 main 分支时构建并部署，适合更新笔记、要闻和前端代码
  push:
    branches:
      - main
  # GitHub Actions 使用 UTC；08:30 UTC = 北京时间 16:30
  # 周一至周五运行。法定节假日若无新行情，脚本不会改写文件，也不会部署。
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install AKShare dependencies
        run: python -m pip install -r requirements.txt

      - name: Update CF0 daily data
        id: update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fetch_data.py --symbol CF0

          if git diff --quiet -- public/data/cf.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "行情无变化，跳过提交和定时部署。"
            exit 0
          fi

          LATEST_DATE=$(python -c "import json; print(json.load(open('public/data/cf.json', encoding='utf-8'))['data'][-1]['date'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cf.json
          git commit -m "data: update CF0 daily data through ${LATEST_DATE}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "已提交并推送 ${LATEST_DATE} 的行情数据。"

      - name: Set up pnpm
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Configure Pages
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        uses: actions/configure-pages@v6

      - name: Install frontend dependencies
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build static site
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        run: pnpm build

      - name: Upload Pages artifact
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || steps.update.outputs.changed == 'true'
        uses: actions/deploy-pages@v5

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          echo "### 郑棉 CF 数据与 Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 触发方式：\`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 行情文件变化：\`${{ steps.update.outputs.changed || '未运行或否' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 数据脚本：${{ steps.update.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
